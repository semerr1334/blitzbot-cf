name = "blitzbot"
main = "worker.js"
compatibility_date = "2026-10-01"

# Эти значения переживают деплой из GitHub. Держи их здесь, а не в панели:
# при деплое через Git обычные (не секретные) переменные из панели стираются,
# а секреты (TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, GITHUB_TOKEN) — сохраняются.
[vars]
GITHUB_REPO = "semerr1334/BlitzServer1120"
DIGEST_HOUR = "21"
# твой id и Акима — /logs, /digest, уведомления и проход без подписки
ADMIN_IDS = "6457932252,7167338117"
# пусто = бот отвечает в любом чате; впиши id группы, чтобы закрыть на свои
ALLOWED_CHAT_IDS = ""

# --- выдача АПК только подписчикам канала ---
# Канал: https://t.me/privatbliz (Wot blitz private, id -1003900573668)
# ВАЖНО: бот должен быть АДМИНИСТРАТОРОМ канала, иначе Telegram не даёт
# проверить подписку. Проверка тогда не блокирует никого (так задумано).
CHANNEL = "@privatbliz"
CHANNEL_LINK = "https://t.me/privatbliz"
REQUIRE_SUB = "1"
